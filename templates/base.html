<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIA Project{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a; /* Black background */
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a; /* Dark grey card */
            border: 1px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); /* Subtle gold glow */
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .container-wide {
            max-width: 1200px;
        }
        h1, h2, h3 {
            color: #d4af37; /* Gold text */
            margin-bottom: 20px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37; /* Gold labels */
            font-weight: 600;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #1e90ff; /* Blue focus border */
            box-shadow: 0 0 5px rgba(30, 144, 255, 0.5);
        }
        textarea { resize: vertical; min-height: 100px; }
        
        button {
            width: 100%;
            padding: 12px;
            background: #d4af37; /* Gold button */
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #1e90ff; /* Blue on hover */
            color: white;
            transform: translateY(-2px);
        }
        
        .flash-messages { margin-bottom: 20px; }
        .flash { padding: 12px; border-radius: 5px; margin-bottom: 10px; font-weight: bold;}
        .flash.success { background: #1a4d1a; color: #4caf50; border: 1px solid #2e7d32; }
        .flash.error { background: #4d1a1a; color: #ff5252; border: 1px solid #c62828; }
        
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #1e90ff; text-decoration: none; font-weight: bold;}
        .links a:hover { color: #d4af37; text-decoration: underline; }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .nav-links a {
            margin-left: 20px;
            color: #1e90ff;
            text-decoration: none;
            font-weight: 600;
        }
        .nav-links a:hover { color: #d4af37; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab {
            padding: 10px 20px;
            background: #2a2a2a;
            color: #aaa;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #444;
        }
        .tab:hover { background: #333; color: #d4af37; }
        .tab.active { background: #1e90ff; color: white; border-color: #1e90ff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #1e90ff; color: white; } /* Blue header */
        tr:hover { background: #2a2a2a; }
    </style>
</head>
<body>
    <div class="container {% block container_class %}{% endblock %}">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
